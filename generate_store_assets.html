<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Store Assets Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: #f0f0f0; padding: 30px; }
    h1 { color: #333; }
    .controls { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 400px; }
    button { padding: 15px 20px; font-size: 16px; cursor: pointer; background: #0088cc; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; text-align: left; }
    button:hover { background: #006699; }
    .note { font-size: 14px; color: #666; margin-bottom: 30px; }
    
    .asset-container { position: absolute; left: -9999px; top: 0; } /* 画面外に配置して見えなくする */
    
    /* 共通デザイン */
    .banner { background: linear-gradient(135deg, #0088cc 0%, #004466 100%); color: white; display: flex; box-sizing: border-box; overflow: hidden; position: relative; }
    .icon-calendar { border: 8px solid white; border-radius: 16px; position: relative; display: inline-block; box-sizing: border-box; }
    .icon-calendar::before { content: ''; position: absolute; top: -16px; left: 20%; width: 12%; height: 24px; background: white; border-radius: 6px; box-shadow: 40px 0 0 white; }
    .icon-calendar::after { content: ''; position: absolute; top: 24%; left: 0; right: 0; height: 12%; background: white; }
    
    /* プロモーションタイル小 (440x280) */
    #promo-small { width: 440px; height: 280px; flex-direction: column; align-items: center; justify-content: center; }
    #promo-small .icon-calendar { width: 80px; height: 80px; margin-bottom: 24px; border-width: 6px; border-radius: 12px; }
    #promo-small .icon-calendar::before { height: 16px; top: -10px; left: 16px; width: 10px; box-shadow: 26px 0 0 white; }
    #promo-small h1 { font-size: 32px; margin: 0; font-weight: bold; text-align: center; color: white; line-height: 1.2; letter-spacing: 1px; }
    
    /* マーキー (1400x560) */
    #marquee { width: 1400px; height: 560px; align-items: center; justify-content: center; gap: 60px; }
    #marquee .icon-calendar { width: 160px; height: 160px; border-width: 12px; border-radius: 24px; margin-right: 40px; }
    #marquee .icon-calendar::before { height: 32px; top: -20px; left: 32px; width: 16px; box-shadow: 64px 0 0 white; }
    #marquee .text-content { display: flex; flex-direction: column; gap: 20px; }
    #marquee h1 { font-size: 80px; margin: 0; font-weight: bold; letter-spacing: 2px; color: white; }
    #marquee p { font-size: 40px; margin: 0; opacity: 0.9; color: white; font-weight: 500; }

    /* スクリーンショット (1280x800) */
    #screenshot { width: 1280px; height: 800px; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    #screenshot .bg-circles { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
    #screenshot .bg-circles::before { content: ''; position: absolute; width: 800px; height: 800px; background: rgba(255,255,255,0.08); border-radius: 50%; top: -200px; right: -200px; }
    #screenshot .bg-circles::after { content: ''; position: absolute; width: 600px; height: 600px; background: rgba(255,255,255,0.05); border-radius: 50%; bottom: -100px; left: -100px; }
    #screenshot .content { z-index: 2; display: flex; align-items: center; gap: 100px; }
    #screenshot .text-part { max-width: 500px; }
    #screenshot h1 { font-size: 64px; margin: 0 0 24px 0; font-weight: bold; line-height: 1.2; color: white; }
    #screenshot p { font-size: 32px; margin: 0; opacity: 0.9; line-height: 1.6; color: white; }
    
    /* 拡張機能のUIモックアップ */
    #screenshot .mockup { width: 420px; height: 580px; background: white; border-radius: 12px; box-shadow: 0 24px 48px rgba(0,0,0,0.4); display: flex; flex-direction: column; overflow: hidden; }
    #screenshot .mockup-header { height: 50px; border-bottom: 1px solid #eaeaea; display: flex; align-items: center; justify-content: center; color: #333; font-weight: bold; font-size: 16px; background: #fff; }
    #screenshot .mockup-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; background: #fff; }
    #screenshot .mockup-item { height: 40px; background: #f4f9fc; border-radius: 6px; border: 1px solid #e1eff8; }
    #screenshot .mockup-item.large { height: 140px; }
    #screenshot .mockup-item.title { height: 20px; width: 40%; background: #e0e0e0; border: none; margin-bottom: -8px; }
    #screenshot .mockup-btn { margin-top: auto; height: 50px; background: #0088cc; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ストア用画像ジェネレーター 🎨</h1>
  <p class="note">Chrome Web Storeに必要なサイズの画像を自動で描画し、ダウンロードします。</p>
  
  <div class="controls">
    <button onclick="downloadAsset('screenshot', 'screenshot_1280x800.png')">📥 スクリーンショット<br><span style="font-size:12px; font-weight:normal;">(1280x800 px)</span></button>
    <button onclick="downloadAsset('promo-small', 'promo_small_440x280.png')">📥 プロモーションタイル（小）<br><span style="font-size:12px; font-weight:normal;">(440x280 px)</span></button>
    <button onclick="downloadAsset('marquee', 'marquee_1400x560.png')">📥 マーキープロモーションタイル<br><span style="font-size:12px; font-weight:normal;">(1400x560 px)</span></button>
  </div>

  <!-- 画像として書き出される要素（画面外） -->
  <div class="asset-container">
    
    <!-- 1. スクリーンショット -->
    <div id="screenshot" class="banner">
      <div class="bg-circles"></div>
      <div class="content">
        <div class="text-part">
          <h1>Calendar<br>Date Copier</h1>
          <p>カレンダーから候補日を<br>選ぶだけ。<br>綺麗なフォーマットで<br>一発コピー！</p>
        </div>
        <div class="mockup">
          <div class="mockup-header">Calendar Date Copier</div>
          <div class="mockup-body">
            <div class="mockup-item title"></div>
            <div class="mockup-item"></div>
            <div class="mockup-item title" style="margin-top:10px;"></div>
            <div class="mockup-item large"></div>
            <div class="mockup-item"></div>
            <div class="mockup-btn">Copy to clipboard</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. プロモーションタイル小 -->
    <div id="promo-small" class="banner">
      <div class="icon-calendar"></div>
      <h1>Calendar<br>Date Copier</h1>
    </div>

    <!-- 3. マーキープロモーション -->
    <div id="marquee" class="banner">
      <div class="icon-calendar"></div>
      <div class="text-content">
        <h1>Calendar Date Copier</h1>
        <p>日程調整を、コピペで超時短！</p>
      </div>
    </div>

  </div>

  <script>
    function downloadAsset(elementId, filename) {
      const element = document.getElementById(elementId);
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ 処理中...';
      
      // html2canvasを使ってHTML要素を画像(Canvas)に変換
      html2canvas(element, { 
        scale: 1, 
        backgroundColor: null 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        btn.innerHTML = '✅ ダウンロード完了！';
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }
  </script>
</body>
</html>
